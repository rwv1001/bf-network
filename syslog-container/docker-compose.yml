version: '3.8'

services:
  rsyslog:
    image: balabit/syslog-ng:latest  # Official syslog-ng image (lighter & ARM64 compatible)
    # Alternative: jumanjiman/rsyslog (smaller, but syslog-ng is more actively maintained)
    container_name: syslog-ng
    ports:
      - "514:514/udp"
      - "514:514/tcp"     # Optional: TCP for more reliable delivery
    volumes:
      - ./logs:/var/log   # Persistent logs on your Pi
      - ./rsyslog.conf:/etc/syslog-ng/syslog-ng.conf:ro  # Custom config
    cap_add:
      - SYSLOG
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
