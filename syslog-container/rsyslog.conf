@version: 4.10

# Listen on all interfaces
source s_network {
    udp(ip("0.0.0.0") port(514));
    tcp(ip("0.0.0.0") port(514));
};

# Filter for NAT logging only
# Matches RFC5424 (UDM) where full message includes "NAT-Logger",
# and BSD syslog (Teltonika) where PROGRAM is set to "NAT-Logger".
filter f_nat {
    program("NAT-Logger") or match("NAT-Logger" value("MESSAGE"));
};

# Log NAT messages only to file with timestamp + host
destination d_all {
    file("/var/log/remote-syslog.log"
         template("$ISODATE $HOST $MSG\n")
         template-escape(no)
         perm(0644));  # Make file readable by all users
};

log {
    source(s_network);
    filter(f_nat);
    destination(d_all);
};

# Optional: Log to console for debugging
destination d_console {
    file("/dev/stdout");
};

log {
    source(s_network);
    filter(f_nat);
    destination(d_console);
};
