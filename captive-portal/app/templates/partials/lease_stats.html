{% if lease_stats %}
<div id="lease-stats-section" class="section-pane" style="{% if 'lease_stats' in dashboard_hidden_sections %}display:none;{% endif %}">
<div class="section-pane-header">
    <h2>&#128202; Active Leases by VLAN</h2>
</div>
<div class="section-pane-body">
    <div style="font-size: 13px; color: #666; margin: 0 0 12px;">
        Counts are based on current entries in the Kea lease file.
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>VLAN</th>
                    <th>Role</th>
                    <th>Subnet</th>
                    <th>Active Leases</th>
                </tr>
            </thead>
            <tbody>
                {% for stat in lease_stats %}
                <tr>
                    <td>{{ stat.vlan_id }}</td>
                    <td style="text-transform: capitalize;">{{ stat.display_name }}</td>
                    <td style="font-family: monospace;">{{ stat.subnet }}</td>
                    <td>{{ stat.active_leases }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
</div>
{% endif %}
