{% extends "base.html" %}
{% block title %}Reset Password - Network Access Portal{% endblock %}
{% block header %}Choose a New Password{% endblock %}
{% block content %}
<p style="color: #555; margin-bottom: 22px; font-size: 15px;">
    Enter and confirm your new password below. It must be at least 8 characters.
</p>
<form method="POST" action="{{ url_for('admin_reset_password', token=token) }}" autocomplete="off">
    <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required autofocus
               minlength="8" autocomplete="new-password"
               placeholder="At least 8 characters">
    </div>
    <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               minlength="8" autocomplete="new-password"
               placeholder="Repeat the password">
    </div>
    <button type="submit" class="btn">Set New Password</button>
</form>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    var pw = document.getElementById('password').value;
    var cpw = document.getElementById('confirm_password').value;
    if (pw !== cpw) {
        e.preventDefault();
        alert('Passwords do not match. Please try again.');
    }
});
</script>

<div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid #e0e0e0; text-align: center; font-size: 14px;">
    <a href="{{ url_for('admin_login') }}" style="color: #667eea; text-decoration: none;">
        ← Back to login
    </a>
</div>
{% endblock %}
