version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: captive-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-captive_portal}
      POSTGRES_USER: ${DB_USER:-portal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portal_user} -d ${DB_NAME:-captive_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: captive-portal-redis
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./app
    container_name: captive-portal-web
    restart: unless-stopped
    user: "${PORTAL_UID:-1000}:${PORTAL_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-portal_user}:${DB_PASSWORD:-change_this_password}@127.0.0.1:5432/${DB_NAME:-captive_portal}
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key_in_production}
      # Microsoft Graph API (for email via Microsoft 365)
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_FROM_EMAIL: ${GRAPH_FROM_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      RADIUS_SERVER: ${RADIUS_SERVER:-192.168.99.4}
      RADIUS_NAS_IP: ${RADIUS_NAS_IP:-192.168.99.1}
      PORTAL_URL: ${PORTAL_URL:-http://portal.local}
      INSTITUTION_URL: ${INSTITUTION_URL:-}
      INSTITUTION_BUTTON_TEXT: ${INSTITUTION_BUTTON_TEXT:-}
      USAGE_POLICY_TEXT: ${USAGE_POLICY_TEXT:-}
      VALID_VLANS: ${VALID_VLANS:-}
      VLAN_SUBNET_ID_MAP: ${VLAN_SUBNET_ID_MAP:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      VERIFICATION_TIMEOUT_MINUTES: ${VERIFICATION_TIMEOUT_MINUTES:-15}
      TEST_ENV: ${TEST_ENV:-false}
      KEA_CONTROL_SOCKET: ${KEA_CONTROL_SOCKET:-/kea/sockets/kea4-ctrl-socket}
      SWITCH_HOST: ${SWITCH_HOST:-192.168.99.1}
      SWITCH_USER: ${SWITCH_USER:-admin}
      SWITCH_PASS: ${SWITCH_PASS}
      SWITCH_NETCONF_PORT: ${SWITCH_NETCONF_PORT:-830}
      SWITCH_KEY_PATH: ${SWITCH_KEY_PATH:-/keys/id_rsa}
      SWITCH_REPLUG_ENABLED: ${SWITCH_REPLUG_ENABLED:-false}
      SWITCH_REPLUG_DELAY_SEC: ${SWITCH_REPLUG_DELAY_SEC:-3}
      SWITCH_REPLUG_ALLOWED_PREFIXES: ${SWITCH_REPLUG_ALLOWED_PREFIXES:-GigabitEthernet,GE}
      SWITCH_REPLUG_DENY_PATTERN: ${SWITCH_REPLUG_DENY_PATTERN:-}
      ACL_QUEUE_DISABLE: "0"
      ACL_QUEUE_DIR: /acl-queue
      ACL_QUEUE_INTERVAL: "3"
      ACL_QUEUE_UMASK: "0002"
      ACL_QUEUE_GID: ${PORTAL_GID:-1000}
      PI_NETWORK_DIR: /host-systemd-network
    volumes:
      - ./app:/app
      - ../kea/leases:/kea/leases:ro  # Access to Kea lease database
      - ../kea/sockets:/kea/sockets  # Access to Kea control socket
      - ../kea/config:/kea/config  # Access to Kea config for pool updates
      - ../kea/docker-compose.yml:/kea/docker-compose.yml:ro  # Kea compose file for restarts
      - /var/run/docker.sock:/var/run/docker.sock  # Allow restarting Kea container
      - ../scripts:/scripts:ro  # Access to dns-hijack.sh
      - ../shared/acl-queue:/acl-queue
      - /home/admin/.ssh:/keys:ro  # SSH keys for switch access
      - /etc/systemd/network:/host-systemd-network
    network_mode: host
    privileged: true  # Required for iptables manipulation from non-root user
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Note: Using host network mode so the portal is accessible on all Pi interfaces
# This ensures devices on VLAN 99 (192.168.99.0/24) can reach it at 192.168.99.4:8080
