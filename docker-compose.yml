# =============================================================================
# Main bf-network stack
#
# Consolidates: captive-portal, freeradius, pihole, dnsmasq, syslog-container,
#               and npm into one file.
#
# Kept separate by design:
#   kea/          – restarted by the web service on pool-config changes
#
# Common operations (run from /home/admin/bf-network):
#   docker compose up -d                  start / reconcile everything
#   docker compose build web              rebuild one image
#   docker compose restart freeradius     bounce one service
#   docker compose logs -f web            tail logs for one service
# =============================================================================

services:
  kea:
    build:
      context: .
      dockerfile: kea/Dockerfile
    image: kea-custom:3.0-alpine
    container_name: kea
    restart: unless-stopped
    network_mode: host
    cap_add: [ NET_ADMIN, NET_RAW ]
    command: ["-c", "/kea/config/dhcp4.json"]
    volumes:
      - ./kea/config:/kea/config
      - ./kea/leases:/kea/leases
      - ./kea/sockets:/kea/sockets
      - ./scripts:/scripts:ro
      - ./scripts/scriptdata:/scripts/scriptdata:ro
      - ./shared/acl-queue:/acl-queue
      - /home/admin/.ssh:/keys:ro
      - ./kea/logs:/kea/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      PORTAL_IP: ${PORTAL_IP:?PORTAL_IP is required – set it in .env}
      PORTAL_URL: ${PORTAL_URL:-}
      HIJACK_DNS_IP: ${HIJACK_DNS_IP:?HIJACK_DNS_IP is required – set it in .env}
      UNREGISTERED_GW: ${UNREGISTERED_GW:?UNREGISTERED_GW is required – set it in .env}
      ACL_DEDUP_WINDOW: ${ACL_DEDUP_WINDOW:-15}
      SWITCH_HOSTS: ${SWITCH_HOSTS:?SWITCH_HOSTS is required – set it in .env}
      NETWORK_WORD: ${NETWORK_WORD:?NETWORK_WORD is required – set it in .env}
      VLAN_PREFIX_MAP: ${VLAN_PREFIX_MAP:?VLAN_PREFIX_MAP is required – set it in .env}
      VALID_VLANS: ${VALID_VLANS:-10,20,30,40,50,60,70,80,90}
      SWITCH_USER: ${SWITCH_USER:-robert}
      SWITCH_SSH_PORT: ${SWITCH_SSH_PORT:-22}
      SWITCH_KEY_PATH: /keys/id_rsa
      # Set to "1" to enable async switch port lookup on every DHCP lease/renew
      SWITCH_PORT_LOOKUP_ENABLED: ${SWITCH_PORT_LOOKUP_ENABLED:-1}
      # How long (seconds) a cached port entry is considered fresh (skip SSH re-query)
      SWITCH_PORT_LOOKUP_CACHE_TTL: ${SWITCH_PORT_LOOKUP_CACHE_TTL:-120}
      WIRED_VLAN: ${WIRED_VLAN:-250}
      SWITCH_HOSTS_BYTES: ${SWITCH_HOSTS_BYTES:-2}
      UNREGISTERED_GW_BYTE: ${UNREGISTERED_GW_BYTE:-2}
      MANAGEMENT_VLAN: ${MANAGEMENT_VLAN:-99}
      PORTAL_IP_BYTE: ${PORTAL_IP_BYTE:-4}
      HIJACK_DNS_IP_BYTE: ${HIJACK_DNS_IP_BYTE:-5}
      LFC_INTERVAL: "300"
      ACL_QUEUE_DISABLE: "0"
      ACL_QUEUE_DIR: /acl-queue
      ACL_QUEUE_INTERVAL: "1"
      ACL_QUEUE_UMASK: "0002"
      ACL_QUEUE_GID: ${PORTAL_GID:-1000}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-captive_portal}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required – set it in .env}
      DATABASE_URL: postgresql://${DB_USER:-portal_user}:${DB_PASSWORD}@${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}/${DB_NAME:-captive_portal}
      CENTRAL_API_URL: ${CENTRAL_API_URL:-}
      CENTRAL_API_KEY: ${CENTRAL_API_KEY:-}
      CENTRAL_SITE_ID: ${CENTRAL_SITE_ID:-}
      KEA_CONTROL_SOCKET: /kea/sockets/kea4-ctrl-socket
      HP5130_POLICY_PATH: ${HP5130_POLICY_PATH:-/scripts/scriptdata/hp5130-policy.json}
      HP5130_CURRENT_CONFIG_PATH: ${HP5130_CURRENT_CONFIG_PATH:-/scripts/scriptdata/hp5130-current-config.json}
      ACL_BASELINE_SCRIPT: ${ACL_BASELINE_SCRIPT:-/scripts/hp5130-acl-baseline.sh}
    entrypoint: |
      sh -c '
      # Abort early if any required variable is missing
      : ${DB_NAME:?DB_NAME is required – set it in .env}
      : ${DB_USER:?DB_USER is required – set it in .env}
      : ${DB_PASSWORD:?DB_PASSWORD is required – set it in .env}
      : ${DB_HOST:?DB_HOST is required – set it in .env}
      : ${DB_PORT:?DB_PORT is required – set it in .env}
      : ${PORTAL_IP:?PORTAL_IP is required – set it in .env}
      : ${HIJACK_DNS_IP:?HIJACK_DNS_IP is required – set it in .env}
      : ${NETWORK_WORD:?NETWORK_WORD is required – set it in .env}
      : ${VLAN_PREFIX_MAP:?VLAN_PREFIX_MAP is required – set it in .env}
      # Generate dhcp4.json — pool bounds computed from VLAN_PREFIX_MAP
      python3 /scripts/generate-kea-config.py > /kea/config/dhcp4.json
      echo "$(date -Iseconds) kea-entrypoint: dhcp4.json generated" >&2
      rm -f /usr/local/var/run/kea/dhcp4.kea-dhcp4.pid
      mkdir -p /usr/local/var/run/kea
      ln -sfn /usr/local/var/run/kea /run/kea
      mkdir -p /kea/sockets
      chown -R 0:1000 /kea/sockets || true
      chmod 750 /kea/sockets || true
      mkdir -p /kea/leases
      chgrp -R ${PORTAL_GID:-1000} /kea/leases || true
      chmod 2775 /kea/leases || true
      mkdir -p /acl-queue
      chgrp -R ${PORTAL_GID:-1000} /acl-queue || true
      chmod 2775 /acl-queue || true
      chmod 755 /kea/leases || true
      umask 0002
      # Ensure the ACL rule-number allocation table exists.
      # This is idempotent — safe to run on every restart and means the system
      # works even if the commit-migration was never manually applied.
      psql "$$DATABASE_URL" -c "
        CREATE TABLE IF NOT EXISTS acl_rule_allocations (
          ip_address   TEXT        NOT NULL PRIMARY KEY,
          rule_num     INTEGER     NOT NULL,
          allocated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
          CONSTRAINT acl_rule_allocations_rule_num_unique UNIQUE (rule_num),
          CONSTRAINT acl_rule_allocations_rule_num_range  CHECK (rule_num BETWEEN 1 AND 19999)
        );
        CREATE INDEX IF NOT EXISTS idx_acl_rule_allocations_rule_num
          ON acl_rule_allocations (rule_num);
      " >&2 2>&1 || true
      # Restore DNS hijack iptables rules from previous session and re-apply
      # switch ACL blocks for any pending devices already in the DB.
      # This ensures hijacking survives Kea restarts and host reboots.
      if [ -x /scripts/kea-startup-restore.sh ]; then
        /scripts/kea-startup-restore.sh || true
      fi
      kea-dhcp4 -c /kea/config/dhcp4.json &
      KEA_PID=$!
      (
        while true; do
          if [ -f /kea/leases/kea-leases4.csv ]; then
            echo "$(date -Iseconds) kea-lfc: running lease file cleanup" >&2
            /usr/sbin/kea-lfc -4 \
              -c /kea/config/dhcp4.json \
              -p /usr/local/var/run/kea/kea-lfc.pid \
              -x /kea/leases/kea-leases4.csv.1 \
              -i /kea/leases/kea-leases4.csv.2 \
              -o /kea/leases/kea-leases4.csv.3 \
              -f /kea/leases/kea-leases4.csv.4 || true
          fi
          sleep ${LFC_INTERVAL:-300}
        done
      ) &
      (
        while true; do
          if [ -f /kea/leases/kea-leases4.csv ]; then
            chgrp ${PORTAL_GID:-1000} /kea/leases/kea-leases4.csv || true
            chmod 664 /kea/leases/kea-leases4.csv || true
          fi
          sleep 5
        done
      ) &
      sleep 3
      chown 0:1000 /kea/sockets/kea4-ctrl-socket || true
      chmod 660 /kea/sockets/kea4-ctrl-socket || true
      chmod 664 /kea/leases/kea-leases4.csv || true
      wait $$KEA_PID
      '


  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: captive-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-captive_portal}
      POSTGRES_USER: ${DB_USER:-portal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - ./captive-portal/data/postgres:/var/lib/postgresql/data
      - ./captive-portal/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portal_user} -d ${DB_NAME:-captive_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: captive-portal-redis
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Captive-portal web app ────────────────────────────────────────────────────
  web:
    build:
      context: ./captive-portal/app
      args:
          PORTAL_UID: ${PORTAL_UID:-1000}
          PORTAL_GID: ${PORTAL_GID:-1000}
    container_name: captive-portal-web
    restart: unless-stopped
    user: "${PORTAL_UID:-1000}:${PORTAL_GID:-1000}"
    environment:
      LOG_LEVEL: DEBUG
      PORTAL_GID: 1000
      PORTAL_UID: 1000
      FLASK_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-portal_user}:${DB_PASSWORD:-change_this_password}@127.0.0.1:5432/${DB_NAME:-captive_portal}
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required – set it in .env}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_FROM_EMAIL: ${GRAPH_FROM_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      RADIUS_SECRET: ${RADIUS_SECRET:?RADIUS_SECRET is required – set it in .env}
      RADIUS_SERVER: ${RADIUS_SERVER:?RADIUS_SERVER is required – set it in .env}
      PORTAL_URL: ${PORTAL_URL:?PORTAL_URL is required – set it in .env}
      PORTAL_POLL_URL: ${PORTAL_POLL_URL:-}
      INSTITUTION_URL: ${INSTITUTION_URL:-}
      INSTITUTION_BUTTON_TEXT: ${INSTITUTION_BUTTON_TEXT:-}
      USAGE_POLICY_TEXT: ${USAGE_POLICY_TEXT:-}
      VALID_VLANS: ${VALID_VLANS:-10,20,30,40,50,60,70,80,90}
      VLAN_DEFAULTS: ${VLAN_DEFAULTS:-10:friars,20:staff,30:students,40:guests,50:contractors,60:iot,70:wifi-registered,80:kiosk,90:printers,99:management,250:wired_unregistered}
      VLAN_POOL_STATUSES: ${VLAN_POOL_STATUSES:-friars,staff,students,guests,contractors,volunteers,iot}
      VLAN_SUBNET_ID_MAP: ${VLAN_SUBNET_ID_MAP:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      VERIFICATION_TIMEOUT_MINUTES: ${VERIFICATION_TIMEOUT_MINUTES:-15}
      WIFI_CONFIRM_TIMEOUT_SEC: ${WIFI_CONFIRM_TIMEOUT_SEC:-120}
      WIFI_CONFIRM_SWEEP_ENABLED: ${WIFI_CONFIRM_SWEEP_ENABLED:-true}
      WIFI_CONFIRM_SWEEP_INTERVAL_SEC: ${WIFI_CONFIRM_SWEEP_INTERVAL_SEC:-30}
      CENTRAL_API_URL: ${CENTRAL_API_URL:-}
      CENTRAL_API_KEY: ${CENTRAL_API_KEY:-}
      CENTRAL_SITE_ID: ${CENTRAL_SITE_ID:-}
      CENTRAL_PUSH_SECRET: ${CENTRAL_PUSH_SECRET:-}
      CENTRAL_REQUEST_TIMEOUT_SEC: ${CENTRAL_REQUEST_TIMEOUT_SEC:-8}
      CENTRAL_POLL_INTERVAL_SEC: ${CENTRAL_POLL_INTERVAL_SEC:-10}
      TEST_ENV: ${TEST_ENV:-false}
      KEA_CONTROL_SOCKET: ${KEA_CONTROL_SOCKET:-/kea/sockets/kea4-ctrl-socket}
      SWITCH_HOSTS: ${SWITCH_HOSTS:?SWITCH_HOSTS is required – set it in .env}
      PORTAL_IP: ${PORTAL_IP:?PORTAL_IP is required – set it in .env}
      PORTAL_IP_BYTE: ${PORTAL_IP_BYTE:-4}
      HIJACK_DNS_IP: ${HIJACK_DNS_IP:?HIJACK_DNS_IP is required – set it in .env}
      ACL_DEDUP_WINDOW: ${ACL_DEDUP_WINDOW:-15}
      SWITCH_USER: ${SWITCH_USER:-robert}
      SWITCH_PASS: ${SWITCH_PASS}
      SWITCH_PORT_LOOKUP_ENABLED: ${SWITCH_PORT_LOOKUP_ENABLED:-1}
      SWITCH_NETCONF_PORT: ${SWITCH_NETCONF_PORT:-830}
      SWITCH_KEY_PATH: /keys/id_rsa
      USER_DEVICE_INTERFACES: ${USER_DEVICE_INTERFACES:-15}
      SWITCH_REPLUG_ENABLED: ${SWITCH_REPLUG_ENABLED:-false}
      SWITCH_REPLUG_DELAY_SEC: ${SWITCH_REPLUG_DELAY_SEC:-3}
      SWITCH_REPLUG_ALLOWED_PREFIXES: ${SWITCH_REPLUG_ALLOWED_PREFIXES:-GigabitEthernet,GE}
      SWITCH_REPLUG_DENY_PATTERN: ${SWITCH_REPLUG_DENY_PATTERN:-}
      ACL_QUEUE_DISABLE: "0"
      ACL_QUEUE_DIR: /acl-queue
      ACL_QUEUE_INTERVAL: "1"
      ACL_QUEUE_UMASK: "0002"
      ACL_QUEUE_GID: ${PORTAL_GID:-1000}
      PI_NETWORK_DIR: /host-systemd-network
      DEFAULT_ISP_ROUTER_NAME: ${DEFAULT_ISP_ROUTER_NAME:-UDM}
      DEFAULT_ISP_ROUTER_SUBNET: ${DEFAULT_ISP_ROUTER_SUBNET:?DEFAULT_ISP_ROUTER_SUBNET is required}
      DEFAULT_ISP_ROUTER_VLAN: ${DEFAULT_ISP_ROUTER_VLAN:-1}
      DEFAULT_ISP_ROUTER_PORT: ${DEFAULT_ISP_ROUTER_PORT:-}
      DEFAULT_ISP_ROUTER_DHCP_TRUST: ${DEFAULT_ISP_ROUTER_DHCP_TRUST:-true}
      GIT_REPO_DIR: ${GIT_REPO_DIR:?GIT_REPO_DIR is required – set it in .env}
      FIRMWARE_TEST_ENABLED: ${FIRMWARE_TEST_ENABLED:-false}
      RESTART_QUEUE_DIR: /restart-queue
      PIHOLE_WEBPASSWORD: ${PIHOLE_WEBPASSWORD:-}
      NETWORK_WORD: ${NETWORK_WORD:-192.168}
      WIRED_VLAN: ${WIRED_VLAN:-250}
      MANAGEMENT_VLAN: ${MANAGEMENT_VLAN:-99}
      ORACLE_VPS_HOST: ${ORACLE_VPS_HOST:?ORACLE_VPS_HOST is required – set it in .env}
      HP5130_POLICY_PATH: ${HP5130_POLICY_PATH:-/scripts/scriptdata/hp5130-policy.json}
      HP5130_CURRENT_CONFIG_PATH: ${HP5130_CURRENT_CONFIG_PATH:-/scripts/scriptdata/hp5130-current-config.json}
      ACL_BASELINE_SCRIPT: ${ACL_BASELINE_SCRIPT:-/scripts/hp5130-acl-baseline.sh}
      DNS_SCRIPT: ${DNS_SCRIPT:-/scripts/dns-hijack.sh}
      PORTAL_ADMIN_USER: ${PORTAL_ADMIN_USER:-admin}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:?PORTAL_ADMIN_PASSWORD is required}
    volumes:
      - ./captive-portal/app:/app
      - ./shared/restart-queue:/restart-queue
      - ./kea/leases:/kea/leases
      - ./kea/sockets:/kea/sockets
      - ./kea/config:/kea/config
      - ./kea/docker-compose.yml:/kea/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts:ro
      - ./scripts/scriptdata:/scripts/scriptdata
      - ./shared/acl-queue:/acl-queue
      - /home/admin/.ssh:/keys:ro
      - /etc/systemd/network:/host-systemd-network
      - ./watchdog:/watchdog-data
      - ${GIT_REPO_DIR}:${GIT_REPO_DIR}
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── NAT log parser ────────────────────────────────────────────────────────────
  nat-parser:
    build: ./captive-portal/nat-parser
    container_name: nat-parser
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-portal_user}:${DB_PASSWORD:-change_this_password}@127.0.0.1:5432/${DB_NAME:-captive_portal}
      LOG_FILE: /logs/remote-syslog.log
      KEA_LEASES_FILE: /kea/leases/kea-leases4.csv
      UDM_HOST: ${UDM_HOST:-}  # Optional: overrides UDM gateway_ip from DB if set
      PORTAL_IP: ${PORTAL_IP:?PORTAL_IP is required}
      PORTAL_IP_BYTE: ${PORTAL_IP_BYTE:-4}
      USER_VLAN_MIN: ${USER_VLAN_MIN:-192.168.2.0}
      USER_VLAN_MAX: ${USER_VLAN_MAX:-192.168.95.255}
      UDM_SSH_KEY: /config/udm_key
      UDM_INSTALL_SCRIPT: /scripts/udm-nat-logger-persist.sh
      ROUTER_SSH_KEY: /config/tel_key  # Shared SSH key for all non-UDM (OpenWRT) routers
      ROUTER_INSTALL_SCRIPT: /scripts/tel-nat-logger-install.sh
      SESSION_GAP_SECONDS: ${NAT_SESSION_GAP_SECONDS:-60}
      STALE_LOG_THRESHOLD_SECONDS: ${NAT_STALE_LOG_THRESHOLD_SECONDS:-3600}
      CHECK_INTERVAL_SECONDS: ${NAT_CHECK_INTERVAL_SECONDS:-5}
      REINSTALL_COOLDOWN_SECONDS: ${NAT_REINSTALL_COOLDOWN_SECONDS:-300}
      RETENTION_DAYS: ${NAT_RETENTION_DAYS:-90}
      POSITION_FILE: /state/nat-parser.pos
    volumes:
      - ./syslog-container/logs:/logs:ro
      - ./kea/leases:/kea/leases:ro
      - /home/admin/.ssh:/config:ro
      - ./scripts:/scripts:ro
      - ./captive-portal/data/nat-parser:/state
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    depends_on:
      db:
        condition: service_healthy

  # ── DNS query log parser ──────────────────────────────────────────────────────
  dns-parser:
    build: ./captive-portal/dns-parser
    container_name: dns-parser
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-portal_user}:${DB_PASSWORD:-change_this_password}@127.0.0.1:5432/${DB_NAME:-captive_portal}
      LOG_FILE: /logs/pihole.log
      DNS_DEDUP_THRESHOLD_HOURS: ${DNS_DEDUP_THRESHOLD_HOURS:-12}
      DNS_CHECK_INTERVAL_SECONDS: ${DNS_CHECK_INTERVAL_SECONDS:-5}
      DNS_RETENTION_DAYS: ${DNS_RETENTION_DAYS:-90}
      PIHOLE_BASE_URL: http://127.0.0.1:8055
      PIHOLE_WEBPASSWORD: ${PIHOLE_WEBPASSWORD:-}
      PIHOLE_POLL_INTERVAL_SECONDS: ${PIHOLE_POLL_INTERVAL_SECONDS:-30}
    volumes:
      - ./pihole/logs:/logs:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    depends_on:
      db:
        condition: service_healthy

  # ── Oracle VPS reverse SSH tunnel ─────────────────────────────────────────────
  tunnel:
    image: alpine:latest
    container_name: portal-tunnel
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/tunnel-entrypoint.sh"]
    volumes:
      - /home/admin/.ssh:/keys:ro
      - ./captive-portal/tunnel-entrypoint.sh:/tunnel-entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      ORACLE_VPS_HOST: ${ORACLE_VPS_HOST:-}
      ORACLE_VPS_USER: ${ORACLE_VPS_USER:-ubuntu}
      ORACLE_VPS_ENABLED: ${ORACLE_VPS_ENABLED:-true}
      ORACLE_VPS_HTTPS_PORT: ${ORACLE_VPS_HTTPS_PORT:-9443}
      ORACLE_VPS_SSH_KEY_PATH: ${ORACLE_VPS_SSH_KEY_PATH:-/keys/oracle_rsa}

  # ── FreeRADIUS ────────────────────────────────────────────────────────────────
  freeradius:
      build:
        context: ./freeradius
        dockerfile: Dockerfile
      image: bf-network-freeradius:local
      container_name: freeradius
      restart: unless-stopped
      network_mode: host
      env_file:
        - ./.env
      volumes:
        - ./freeradius/raddb/clients.conf.template:/etc/freeradius/clients.conf.template:ro
        - ./freeradius/raddb/proxy.conf.template:/etc/freeradius/proxy.conf.template:ro
        - ./freeradius/raddb/mods-config/files/authorize:/etc/freeradius/mods-config/files/authorize:ro
        - ./freeradius/raddb/sql.template:/etc/freeradius/sql.template:ro
        - ./freeradius/raddb/mods-config/sql/main/postgresql/queries.conf:/etc/freeradius/mods-config/sql/main/postgresql/queries.conf:ro
        - ./freeradius/raddb/sites-available/coa:/etc/freeradius/sites-available/coa:ro
        - ./freeradius/raddb/sites-enabled/coa:/etc/freeradius/sites-enabled/coa:ro
        - ./freeradius/raddb/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
        - ./freeradius/entrypoint.sh:/entrypoint.sh:ro
        - /etc/localtime:/etc/localtime:ro
      entrypoint: ["/entrypoint.sh"]

  # ── Pi-Hole DNS ───────────────────────────────────────────────────────────────
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    env_file:
      - ./.env
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:-changeme}
      FTLCONF_dns_listeningMode: SINGLE
      FTLCONF_dns_interface: eth0.${MANAGEMENT_VLAN:-99}
      FTLCONF_dns_upstreams: "8.8.8.8;8.8.4.4"
      FTLCONF_webserver_port: "8055"
      FTLCONF_webserver_api_max_sessions: "100"
      FTLCONF_misc_etc_dnsmasq_d: "true"
      MANAGEMENT_VLAN: ${MANAGEMENT_VLAN:-99}
      VALID_VLANS: ${VALID_VLANS:-10,20,30,40,50,60,70,80,90}
      NETWORK_WORD: ${NETWORK_WORD:-192.168}
      PORTAL_IP: ${PORTAL_IP:?PORTAL_IP is required}
      PORTAL_IP_BYTE: ${PORTAL_IP_BYTE:-4}
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/logs:/var/log/pihole
      - /etc/localtime:/etc/localtime:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -n "$${PORTAL_URL:-}" ]; then
          PORTAL_DOMAIN=$$(printf '%s' "$$PORTAL_URL" | sed 's|https\?://||' | cut -d/ -f1 | cut -d: -f1)
          mkdir -p /etc/pihole
          printf '%s %s\n' "$${PORTAL_IP}" "$$PORTAL_DOMAIN" > /etc/pihole/custom.list
        fi
        mkdir -p /etc/dnsmasq.d
        printf 'bind-interfaces\nexcept-interface=eth0.99\nlisten-address=127.0.0.1\nlisten-address=%s\n' "$${PORTAL_IP}" > /etc/dnsmasq.d/99-local-bind.conf
        # Replace placeholders in static config files with environment values
        if [ -n "$${MANAGEMENT_VLAN:-}" ]; then
          sed -i "s/eth0\.\$${MANAGEMENT_VLAN:-99}/eth0.$${MANAGEMENT_VLAN}/g" /etc/pihole/dnsmasq.conf
          sed -i "s/eth0\.\$${MANAGEMENT_VLAN:-99}/eth0.$${MANAGEMENT_VLAN}/g" /etc/dnsmasq.d/99-local-bind.conf
          find /etc/pihole -type f \( -name custom.list -o -name 'captive-portal.hosts' \) -exec sed -i "s/192\.168\.\$${MANAGEMENT_VLAN:-99}/192.168.$${MANAGEMENT_VLAN}/g" {} \;
        fi
        exec /usr/bin/start.sh

  # ── DNSmasq hijack (captive-portal redirect for unregistered devices) ─────────
  dnsmasq-hijack:
    build: ./dnsmasq
    container_name: dnsmasq-hijack
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    env_file:
      - ./.env
    volumes:
      - /var/log:/var/log
      - /etc/localtime:/etc/localtime:ro

  # ── Syslog receiver ───────────────────────────────────────────────────────────
  rsyslog:
    image: balabit/syslog-ng:latest
    container_name: syslog-ng
    restart: unless-stopped
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    volumes:
      - ./syslog-container/logs:/var/log
      - ./syslog-container/rsyslog.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - SYSLOG
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Proxy Manager ───────────────────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:81/api/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  npm-setup:
    image: python:3-alpine
    network_mode: host
    restart: "no"
    env_file:
      - ./.env
    volumes:
      - ./npm/setup.py:/setup.py:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["python", "/setup.py"]
    depends_on:
      npm:
        condition: service_healthy

  # ── Watchdog ──────────────────────────────────────────────────────────────────
  watchdog:
    build: ./watchdog
    image: bf-watchdog:latest
    container_name: watchdog
    restart: unless-stopped
    network_mode: host
    environment:
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      GRAPH_FROM_EMAIL: ${GRAPH_FROM_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      PORTAL_URL: ${PORTAL_URL:-}
      # Where to find the host root for disk-usage checks (mounted below)
      WATCHDOG_DISK_PATH: /hostfs
      # Persist alert state across watchdog restarts
      WATCHDOG_STATE_FILE: /data/state.json
      # Central API connectivity check (uses CENTRAL_API_URL from .env)
      CENTRAL_API_URL: ${CENTRAL_API_URL:-}
      # Peer Pi monitoring (optional — leave blank to disable)
      WATCHDOG_PEER_HOST: ${WATCHDOG_PEER_HOST:-}
      WATCHDOG_PEER_HEALTH_URL: ${WATCHDOG_PEER_HEALTH_URL:-}
      WATCHDOG_PEER_SSH_USER: ${WATCHDOG_PEER_SSH_USER:-admin}
      WATCHDOG_PEER_SSH_KEY: /keys/id_rsa
      WATCHDOG_PEER_REBOOT_ENABLED: ${WATCHDOG_PEER_REBOOT_ENABLED:-false}
      # Syslog staleness check — alert if remote-syslog.log not updated within 10 minutes
      WATCHDOG_SYSLOG_LOG_PATH: /logs/remote-syslog.log
      WATCHDOG_SYSLOG_STALE_SEC: "600"
      # HP5130 switch hardware health checks
      WATCHDOG_SWITCH_HOSTS: ${SWITCH_HOSTS:-}
      WATCHDOG_SWITCH_USER: ${SWITCH_USER:-robert}
      WATCHDOG_SWITCH_KEY_PATH: /keys/id_rsa
      # Space-separated IPs of switches that have an RPS fitted.
      # Absent/Fault on a secondary PSU is only alerted for listed switches.
      WATCHDOG_SWITCH_RPS_HOSTS: ${SWITCH_RPS_HOSTS:-}
    volumes:
      # Docker Engine socket — allows container inspection via Unix API (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host root filesystem — for accurate disk-usage reporting
      - /:/hostfs:ro
      # Persistent state (debounce / alert tracking)
      - ./watchdog:/data
      # SSH key for optional peer reboot
      - /home/admin/.ssh:/keys:ro
      # Syslog log directory — for staleness check
      - ./syslog-container/logs:/logs:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
