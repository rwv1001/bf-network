# Custom SQL queries for captive portal database

# Only return VLAN attributes when the device is registered.
authorize_check_query = "\
  SELECT NULL AS id, '%{SQL-User-Name}' AS username, 'Auth-Type' AS attribute, \
	  'Accept' AS value, ':=' AS op \
  FROM devices \
  WHERE registration_status = 'registered' \
    AND COALESCE(wired_target_vlan, current_vlan) IS NOT NULL \
    AND lower(replace(replace(mac_address,':',''),'-','')) = \
	 lower(replace(replace('%{SQL-User-Name}',':',''),'-',''))"
authorize_reply_query = "\
  SELECT NULL AS id, '%{SQL-User-Name}' AS username, 'Tunnel-Type' AS attribute, \
	  'VLAN' AS value, ':=' AS op \
  FROM devices \
  WHERE registration_status = 'registered' \
    AND COALESCE(wired_target_vlan, current_vlan) IS NOT NULL \
    AND lower(replace(replace(mac_address,':',''),'-','')) = \
	 lower(replace(replace('%{SQL-User-Name}',':',''),'-','')) \
  UNION ALL \
  SELECT NULL AS id, '%{SQL-User-Name}' AS username, 'Tunnel-Medium-Type' AS attribute, \
	  'IEEE-802' AS value, ':=' AS op \
  FROM devices \
  WHERE registration_status = 'registered' \
    AND COALESCE(wired_target_vlan, current_vlan) IS NOT NULL \
    AND lower(replace(replace(mac_address,':',''),'-','')) = \
	 lower(replace(replace('%{SQL-User-Name}',':',''),'-','')) \
  UNION ALL \
  SELECT NULL AS id, '%{SQL-User-Name}' AS username, 'Tunnel-Private-Group-Id' AS attribute, \
	  COALESCE(wired_target_vlan, current_vlan)::text AS value, ':=' AS op \
  FROM devices \
  WHERE registration_status = 'registered' \
    AND COALESCE(wired_target_vlan, current_vlan) IS NOT NULL \
    AND lower(replace(replace(mac_address,':',''),'-','')) = \
	 lower(replace(replace('%{SQL-User-Name}',':',''),'-',''))"

# Accounting queries
accounting_start_query = "INSERT INTO radacct (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, acctstarttime, acctupdatetime, acctauthentic, connectinfo_start, calledstationid, callingstationid, servicetype, framedprotocol, framedipaddress, framedipv6address, framedipv6prefix, framedinterfaceid, delegatedipv6prefix) VALUES ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{User-Name}', '%{Realm}', '%{NAS-IP-Address}', '%{NAS-Port-Id}', '%{NAS-Port-Type}', to_timestamp(%{integer:Event-Timestamp}), to_timestamp(%{integer:Event-Timestamp}), '%{Acct-Authentic}', '%{Connect-Info}', '%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Service-Type}', '%{Framed-Protocol}', '%{Framed-IP-Address}', '%{Framed-IPv6-Address}', '%{Framed-IPv6-Prefix}', '%{Framed-Interface-Id}', '%{Delegated-IPv6-Prefix}')"

accounting_update_query = "UPDATE radacct SET acctupdatetime = to_timestamp(%{integer:Event-Timestamp}), acctsessiontime = '%{Acct-Session-Time}', acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}'::bigint << 32 | '%{%{Acct-Input-Octets}:-0}'::bigint, acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}'::bigint << 32 | '%{%{Acct-Output-Octets}:-0}'::bigint WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_stop_query = "UPDATE radacct SET acctstoptime = to_timestamp(%{integer:Event-Timestamp}), acctsessiontime = '%{Acct-Session-Time}', acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}'::bigint << 32 | '%{%{Acct-Input-Octets}:-0}'::bigint, acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}'::bigint << 32 | '%{%{Acct-Output-Octets}:-0}'::bigint, acctterminatecause = '%{Acct-Terminate-Cause}', connectinfo_stop = '%{Connect-Info}' WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
