version: "3.8"
services:
  freeradius:
    image: freeradius/freeradius-dev:arm64v8-v3.2.x
    container_name: freeradius
    restart: unless-stopped

    # host networking keeps UDP 1812/1813 simple
    network_mode: host

    # Environment variables (loaded from .env file)
    environment:
      - RADIUS_SECRET=${RADIUS_SECRET}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-captive_portal}
      - DB_USER=${DB_USER:-portal_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_password}

    volumes:
      - ./raddb/clients.conf.template:/etc/freeradius/clients.conf.template:ro
      - ./raddb/proxy.conf.template:/etc/freeradius/proxy.conf.template:ro
      - ./raddb/mods-config/files/authorize:/etc/freeradius/mods-config/files/authorize:ro
      - ./raddb/sql.template:/etc/freeradius/sql.template:ro
      - ./raddb/mods-config/sql/main/postgresql/queries.conf:/etc/freeradius/mods-config/sql/main/postgresql/queries.conf:ro
      - ./raddb/sites-available/coa:/etc/freeradius/sites-available/coa:ro
      - ./raddb/sites-enabled/coa:/etc/freeradius/sites-enabled/coa:ro
      - ./raddb/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
      - ./entrypoint.sh:/entrypoint.sh:ro

    # Use custom entrypoint to substitute environment variables
    entrypoint: ["/entrypoint.sh"]
