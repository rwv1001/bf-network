# Listen only on 192.168.99.4 (normal DNS for registered devices and VLAN 99)
# 192.168.99.5 is used by the hijacking DNSmasq instance
listen-address=192.168.99.4
bind-interfaces

# Enable query logging for DNS resolution tracking
log-queries
log-facility=/var/log/dnsmasq-queries.log

# Don't rely on host resolvers; we provide a local answer even without Internet
no-resolv
# Forward only to OpenDNS
server=208.67.222.222
server=208.67.220.220
strict-order

# Block DoH/DoT/encrypted DNS endpoints (NXDOMAIN for clean failure)
server=/mask.icloud.com/
server=/mask-h2.icloud.com/
server=/mask-api.icloud.com/
server=/use-application-dns.net/
server=/dns.google/
server=/cloudflare-dns.com/
server=/one.one.one.one/
server=/dns.quad9.net/
server=/doh.opendns.com/

# Portal domain address record is generated dynamically by entrypoint.sh
# from the PORTAL_URL env var in captive-portal/.env — no hardcoded domain here.

# DO NOT override captive portal detection domains for registered devices
# Let them reach the real endpoints so they clear the exclamation mark
