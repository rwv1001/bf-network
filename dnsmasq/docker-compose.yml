services:
  # Hijacking DNSmasq - serves HIJACK_DNS_IP for unregistered devices
  # Redirects ALL domains to captive portal (PORTAL_IP)
  dnsmasq-hijack:
    build: .
    container_name: dnsmasq-hijack
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    env_file:
      - ../captive-portal/.env
    volumes:
      - /var/log:/var/log
