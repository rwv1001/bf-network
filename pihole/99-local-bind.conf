# Force Pi-Hole's embedded dnsmasq to bind only to 192.168.99.4.
# Without these directives Pi-Hole would:
#   a) not read this file at all (misc.etc_dnsmasq_d must be true),
#   b) still bind 0.0.0.0:53 (wildcard) via SINGLE mode's interface=eth0.99,
#      which conflicts with dnsmasq-hijack already holding 192.168.99.5:53.
#
# bind-interfaces    – use specific sockets instead of 0.0.0.0 wildcard
# except-interface   – cancel out the interface=eth0.99 FTL auto-generates
#                      (eth0.99 has both .4 and .5; we only want .4)
# listen-address x2  – explicitly add loopback (for healthcheck) and .4
bind-interfaces
except-interface=eth0.99
listen-address=127.0.0.1
listen-address=192.168.99.4
