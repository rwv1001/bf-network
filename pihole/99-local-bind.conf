# Force Pi-Hole's embedded dnsmasq to bind only to 192.168.99.4.
# This prevents it from also binding 192.168.99.5, which is exclusively
# held by dnsmasq-hijack (for unregistered-device captive portal redirect).
# Both IPs live on eth0.99; the SINGLE/interface= setting in docker-compose
# would include both without this explicit restriction.
listen-address=192.168.99.4
