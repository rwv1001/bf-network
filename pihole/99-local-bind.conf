# Pi-Hole dnsmasq bind configuration — REFERENCE TEMPLATE
# This file is NOT used directly. The actual config is generated at container
# startup by pihole/docker-compose.yml entrypoint from PORTAL_IP env var.
#
# bind-interfaces    – use specific sockets instead of 0.0.0.0 wildcard
# except-interface   – cancel out the interface=eth0.99 FTL auto-generates
#                      (eth0.99 has both PORTAL_IP and HIJACK_DNS_IP; we only want PORTAL_IP)
# listen-address x2  – explicitly add loopback (for healthcheck) and PORTAL_IP
#
# bind-interfaces
# except-interface=eth0.99
# listen-address=127.0.0.1
# listen-address=${PORTAL_IP}
