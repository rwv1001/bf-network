services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:81/api/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Runs once on startup; creates the PORTAL_URL proxy host + LE cert if absent.
  npm-setup:
    image: python:3-alpine
    network_mode: host
    restart: "no"
    env_file:
      - ../captive-portal/.env
    volumes:
      - ./setup.py:/setup.py:ro
    command: ["python", "/setup.py"]
    depends_on:
      npm:
        condition: service_healthy
