services:
  kea:
    build: .
    image: kea-custom:3.0-alpine
    container_name: kea
    restart: unless-stopped
    network_mode: host
    cap_add: [ NET_ADMIN, NET_RAW ]
    command: ["-c", "/kea/config/dhcp4.json"]
    volumes:
      - ./config:/kea/config
      - ./leases:/kea/leases
      - ./sockets:/kea/sockets
      - ../scripts:/scripts:ro
      - ../shared/acl-queue:/acl-queue
      - ../kea-hooks/dynamic_subnet/dhcp_dns_hijack.so:/usr/local/lib/kea/hooks/dhcp_dns_hijack.so:ro
      - /home/admin/.ssh:/keys:ro
    environment:
      SWITCH_HOST: ${SWITCH_HOST:-192.168.1.3}
      SWITCH_USER: ${SWITCH_USER:-robert}
      SWITCH_SSH_PORT: ${SWITCH_SSH_PORT:-22}
      SWITCH_KEY_PATH: ${SWITCH_KEY_PATH:-/keys/id_rsa}
      ACL_QUEUE_DISABLE: "1"
      ACL_QUEUE_DIR: /acl-queue
      ACL_QUEUE_INTERVAL: "3"
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-captive_portal}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_database_password_here}
    entrypoint: |
      sh -c '
      rm -f /usr/local/var/run/kea/dhcp4.kea-dhcp4.pid
      mkdir -p /kea/sockets
      chown -R 0:1000 /kea/sockets || true
      chmod 750 /kea/sockets || true
      mkdir -p /kea/leases
      chmod 755 /kea/leases || true
      umask 022
      kea-dhcp4 -c /kea/config/dhcp4.json &
      KEA_PID=$!
      sleep 3
      chown 0:1000 /kea/sockets/kea4-ctrl-socket || true
      chmod 660 /kea/sockets/kea4-ctrl-socket || true
      chmod 644 /kea/leases/kea-leases4.csv || true
      wait $$KEA_PID
      '
